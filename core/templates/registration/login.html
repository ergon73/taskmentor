{% extends "base.html" %}
{% block title %}Вход — TaskMentor{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm mt-4">
            <div class="card-body p-4">
                <h3 class="text-center mb-1">&#x1F7E0; TaskMentor</h3>
                <p class="text-center text-muted mb-4">Вход в систему</p>

                <form method="post" novalidate>
                    {% csrf_token %}
                    {% if next %}
                    <input type="hidden" name="next" value="{{ next }}">
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Логин</label>
                        <input type="text" name="username" class="form-control"
                               placeholder="Имя пользователя" autofocus required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Пароль</label>
                        <input type="password" name="password" class="form-control"
                               placeholder="Пароль" required>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 mt-1">
                        Войти
                    </button>
                </form>

                <hr class="my-3">
                <p class="text-center mb-0 text-muted small">
                    Нет аккаунта?
                    <a href="{% url 'core:register' %}">Зарегистрироваться</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
